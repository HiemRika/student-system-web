<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            padding: 20px;
            text-align: center;
        }
        
        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .card .info-label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Student">
        <h2>John Doe</h2>
        <p><span class="info-label">ID:</span> 12345</p>
        <p><span class="info-label">Email:</span> john@example.com</p>
        <p><span class="info-label">Major:</span> Computer Science</p>
        <p><span class="info-label">GPA:</span> 3.8</p>
    </div>
</body>
</html>
